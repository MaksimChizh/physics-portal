<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Вхід до Фізичного Порталу</title>
    <style>
        * { box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            background: #f0f2f5;
            margin: 0;
            padding: 15px;
        }
        .login-card {
            background: white;
            padding: 30px 25px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.08);
            width: 100%;
            max-width: 340px;
            text-align: center;
        }
        h2 { margin-top: 0; color: #2c3e50; font-size: 22px; }
        p { color: #6c757d; font-size: 14px; margin-bottom: 20px; }
        
        input {
            width: 100%;
            padding: 14px;
            font-size: 16px;
            border: 2px solid #ced4da;
            border-radius: 8px;
            outline: none;
            margin-bottom: 12px;
            text-align: center;
            transition: border-color 0.2s;
        }
        input:focus { border-color: #007bff; }
        
        button {
            width: 100%;
            padding: 14px;
            background: #007bff;
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            transition: background 0.2s;
        }
        button:hover { background: #0056b3; }
        button:active { transform: scale(0.98); }

        .error-msg {
            color: #dc3545;
            font-size: 13px;
            font-weight: bold;
            margin-bottom: 12px;
            display: none;
        }
    </style>
</head>
<body>

    <div class="login-card">
        <h2>🔒 Закритий доступ</h2>
        <p>Введіть пароль для доступу до задачника та формул:</p>
        
        <div id="errorMsg" class="error-msg">Невірний пароль! Спробуйте ще раз.</div>
        
        <!-- ОДНЕ ПОЛЕ ДЛЯ ПАРОЛЯ -->
        <input type="password" id="passwordInput" placeholder="Введіть пароль..." autofocus>
        <button onclick="doLogin()">Увійти</button>
    </div>

    <script>
        async function doLogin() {
            const pass = document.getElementById('passwordInput').value;
            const error = document.getElementById('errorMsg');

            const res = await fetch('/api/login', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ password: pass }) // Надсилаємо тільки пароль
            });

            if (res.ok) {
                window.location.href = '/'; // Успішний вхід -> на головну сторінку
            } else {
                error.style.display = 'block';
                document.getElementById('passwordInput').value = '';
                document.getElementById('passwordInput').focus();
            }
        }

        // Дозволяє увійти натисканням клавіші Enter
        document.getElementById('passwordInput').addEventListener('keypress', function(e) {
            if (e.key === 'Enter') {
                doLogin();
            }
        });
    </script>
</body>
</html>
